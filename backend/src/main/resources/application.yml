spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/fueld
    username: fueld
    password: fueld
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true

app:
  jwt:
    # Für Produktion: JWT_SECRET env-Variable setzen (openssl rand -base64 32)
    secret: ${JWT_SECRET:MWbT+ZE4QhkufNmZtQ8yknnvW7nYsDZr9l/9nccHQeE=}
    expiration-ms: 2592000000  # 30 Tage
  claude:
    api-key: ${ANTHROPIC_API_KEY:}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:*}
  garmin:
    # Personal API Key aus Garmin Connect (Einstellungen → Personal API Key).
    # Ohne Key und User-Mail ist der Garmin-Import deaktiviert (kein Fehler).
    api-key: ${GARMIN_API_KEY:}
    user-email: ${GARMIN_USER_EMAIL:}
    sync-cron: ${GARMIN_SYNC_CRON:0 30 18 * * *}
  push:
    # VAPID-Schlüsselpaar generieren: npx web-push generate-vapid-keys
    # Ohne beide Werte sind Push-Benachrichtigungen deaktiviert (kein Fehler).
    vapid:
      public-key: ${VAPID_PUBLIC_KEY:}
      private-key: ${VAPID_PRIVATE_KEY:}
      subject: ${VAPID_SUBJECT:mailto:noreply@fueld.app}
