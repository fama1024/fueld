name: Auto-Merge

# PR mit Label "automerge" versehen → GitHubs native Auto-Merge wird aktiviert.
# GitHub mergt den PR dann selbstständig (Squash), sobald die Pflicht-Checks
# "Backend Build" und "Frontend Build" grün sind. Branch-Protection auf main ist
# das eigentliche Gate; dieser Workflow drückt nur den "Auto-Merge"-Knopf.
# Branch wird nach dem Merge automatisch gelöscht (Repo-Einstellung).

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.label.name == 'automerge' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Auto-Merge aktivieren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        # --auto wartet auf die Checks. Sind sie schon grün, lehnt --auto ab
        # ("clean status") – dann direkt mergen (Branch-Protection prüft trotzdem).
        run: |
          gh pr merge "$PR_URL" --auto --squash --delete-branch \
            || gh pr merge "$PR_URL" --squash --delete-branch
